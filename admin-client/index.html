<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/admin/favicon.svg" />
    <link rel="alternate icon" href="/admin/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/admin/apple-touch-icon.png" />
    <link rel="manifest" href="/admin/site.webmanifest" />
    <meta name="theme-color" content="#E11D48" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#F43F5E" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ELITE Admin Portal, Department of Information Technology</title>
    <!-- The four families of the type system (REDESIGN_PLAN §4.2), one role each:
         Playfair Display = display, Inter = body, DM Sans = UI, JetBrains Mono =
         mono. Identical to `web/index.html` — one request for all four, `preconnect`
         so the stylesheet starts on the first bytes, and `display=swap` so text
         paints immediately in the fallback and reflows when the face arrives.
         Every heading here used to resolve to Georgia, because the admin client
         self-hosted Sora / Plus Jakarta Sans, which the shared preset no longer
         names. The stacks live in `shared/tokens.mjs`. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('elite_admin_theme_default');
          var mode = saved && (saved === 'light' || saved === 'dark' || saved === 'system') ? saved : 'system';
          var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.setAttribute('data-theme', 'dark');
        } catch (e) {
          // fail safe: localStorage unavailable or blocked
        }
      })();
    </script>
  </head>
  <body class="bg-surface-canvas text-ink min-h-screen selection:bg-brand selection:text-on-primary antialiased font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
