services:
  - type: web
    name: elite-portal-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run render:build
    startCommand: npm start
    region: singapore
    plan: free # Recommendation: Upgrade to starter ($7/mo) for persistent background sync cron and eliminating 50s cold boots
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_KEY
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: FEATURE_GITHUB_PORTFOLIO
        value: "true"
      - key: GITHUB_OAUTH_CLIENT_ID
        sync: false
      - key: GITHUB_OAUTH_CLIENT_SECRET
        sync: false
      - key: GITHUB_OAUTH_REDIRECT_URI
        sync: false
      - key: STUDENT_APP_LOGIN_URL
        sync: false
      - key: GITHUB_API_TOKEN
        sync: false
      - key: INTERNAL_SYNC_SECRET
        sync: false

